<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22262b"><title>Human Sim · Browser Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<style>:root{--bg:#f4f1ea;--card:#fff;--ink:#22262b;--mut:#6b7280;--acc:#2f6fdb;--good:#2e9e5b;--warn:#e0a21a;--bad:#d64045;--line:#e3ded3;--tab:64px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{background:#22262b;color:#fff;padding:8px 12px calc(8px) 12px;padding-top:max(8px,env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.clock{font-weight:700;font-size:17px}.clock small{font-weight:400;opacity:.75;font-size:13px}
.money{display:flex;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.money b{font-size:15px}.neg{color:#ff6b6b!important;font-weight:700}
.mini{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.mini div{font-size:11px;opacity:.95}.mini i{display:block;height:5px;border-radius:3px;background:#444;margin-top:2px;overflow:hidden}
.mini i b{display:block;height:100%}
.menu-btn{background:#3a3f46;color:#fff;border:0;border-radius:10px;min-width:44px;min-height:44px;font-size:20px}
main{flex:1;overflow-y:auto;padding:12px 12px calc(var(--tab) + 16px);-webkit-overflow-scrolling:touch}
nav.tabs{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;height:calc(var(--tab) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex;z-index:20}
nav.tabs button{flex:1;border:0;background:none;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px}
nav.tabs button span{font-size:22px}nav.tabs button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--line)}
.card h2{margin:0 0 8px;font-size:18px}.card h3{margin:10px 0 6px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.place-h{display:flex;gap:12px;align-items:center}.place-h .em{font-size:40px}
.sub{color:var(--mut);font-size:14px}
.btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;padding:10px 14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:#fafaf7;font:inherit;color:inherit;text-align:left;cursor:pointer}
.btn:active{transform:scale(.99);background:#eef2fb}.btn .r{color:var(--mut);font-size:13px;white-space:nowrap;text-align:right}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.pri .r{color:#dfe8ff}
.btn.crime{border-color:#e7b3b5;background:#fff5f5}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px}.row .btn{flex:1;justify-content:center;text-align:center}
.bar{height:10px;background:#ece8df;border-radius:6px;overflow:hidden}.bar b{display:block;height:100%;border-radius:6px}
.stat{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:15px}
.stat .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}.kv:last-child{border:0}
.kv b{font-variant-numeric:tabular-nums}
.log{font-size:14px;color:#444}.log div{padding:4px 0;border-bottom:1px solid #f0ece4}.log div:first-child{font-weight:600;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#eef2fb;border-radius:20px;padding:6px 10px;font-size:14px}
.person{display:flex;gap:10px;align-items:flex-start}.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.person .info{flex:1;min-width:0}.person .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sbtn{min-height:44px;min-width:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:#fafaf7;font:inherit;font-size:14px;cursor:pointer}
.sbtn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}.sbtn[disabled]{opacity:.4}
.obj{display:flex;gap:8px;padding:6px 0}.obj .ck{width:24px;text-align:center}
#mapwrap{position:relative;height:min(62vh,560px);border-radius:14px;overflow:hidden;background:#cfe3ef;touch-action:none;border:1px solid var(--line)}
#mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;border-radius:50%;border:2px solid #fff;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mk.here{background:#ffd84d;border-color:#22262b}.mk.closed{filter:grayscale(.8);opacity:.75}
.mklab{position:absolute;transform:translate(-50%,0);font-size:11px;font-weight:700;background:rgba(255,255,255,.85);padding:1px 5px;border-radius:6px;white-space:nowrap;pointer-events:none}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:44px;height:44px;border-radius:10px;border:0;background:#fff;font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
#modal{position:fixed;inset:0;background:rgba(20,22,26,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
#modal.on{display:flex}#modal .sheet{background:#fff;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){#modal{align-items:center}#modal .sheet{border-radius:18px;max-width:520px}}
.sheet h2{margin:0 0 8px}.sheet p{margin:6px 0 10px}
.stations{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stations button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:#fafaf7;font-size:15px}
.stations button span{display:block;font-size:26px}
.boardv{font-size:28px;min-height:44px;background:#f6f3ec;border-radius:10px;padding:8px;margin:8px 0;text-align:center}
.wanted{color:var(--bad);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 14px);background:#22262b;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;z-index:40;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.btn small{display:block;margin-top:2px}
</style></head><body>

// ===== Human Sim engine: pure, deterministic, no DOM =====

const ENGINE_VERSION = 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let W, P, PID, EV, ST;

function newPlayer(name = 'You') {

function newGame(seed = 12345) {

// ---- deterministic RNG (mulberry32 in state; world.force = queued rolls for tests) ----
function rnd() {
  if (W.force && W.force.length) return W.force.shift();
  let t = (W.rng = (W.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ---- helpers ----
const moneyTxt = c => (c < 0 ? '-' : '') + '$' + Math.floor(Math.abs(c) / 100).toLocaleString('en-US') + '.' + String(Math.abs(c) % 100).padStart(2, '0');
const day = (t = W.t) => Math.floor(t / 1440) + 1;
const hourF = (t = W.t) => (t % 1440) / 60;
const clockTxt = (t = W.t) => { const m = t % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.floor(m % 60)).padStart(2, '0'); };
const stars = (pl = P) => Math.ceil(pl.heat / 20);
function log(msg, pl = P, pid = PID) { pl.log.unshift(`<small class="sub">D${day()} ${clockTxt()}</small> ${msg}`); pl.log = pl.log.slice(0, 30); EV.push({pid, msg}); }
function popup(title, html, pid = PID) { EV.push({pid, title, html}); }
function addNeed(k, v, pl = P) { if (k === 'health') pl.health = clamp(pl.health + v, 0, 100); else pl.needs[k] = clamp(pl.needs[k] + v, 0, 100); }
function applyFx(fx) { for (const k in fx) addNeed(k, fx[k]); }
function addSkill(k, v) { P.skills[k] = clamp(+(P.skills[k] + v).toFixed(3), 0, 10); }
function addRep(k, v) { P.rep[k] = clamp(+(P.rep[k] + v).toFixed(2), 0, 100); }
function refillAll(pl = P) { for (const k in pl.needs) pl.needs[k] = 100; pl.health = 100; }
const canPay = c => P.cash + Math.max(0, P.bank) >= c;
function pay(c, first = 'cash') {
  if (!canPay(c)) return false;
  if (first === 'cash') { const a = Math.min(P.cash, c); P.cash -= a; P.bank -= (c - a); }
  else { const a = Math.min(Math.max(0, P.bank), c); P.bank -= a; P.cash -= (c - a); }
  return true;
}
function isOpen(id, t = W.t) { const [a, b] = PLACES[id].open, h = hourF(t); return (h >= a && h < b) || (h + 24 >= a && h + 24 < b); }
function whereIs(p, t = W.t) { const h = hourF(t); for (const [a, b, l] of p.s) if ((h >= a && h < b) || (h + 24 >= a && h + 24 < b)) return l; return null; }
const peopleAt = id => PEOPLE.filter(p => whereIs(p) === id);
function dist(a, b) { const A = PLACES[a], B = PLACES[b]; return Math.hypot(A.x - B.x, A.z - B.z) * 1.3; }
const walkMin = (id, pl = P) => Math.max(3, Math.round(dist(pl.loc, id) / (80 * (1 + 0.05 * pl.skills.speed))));
const busMin = (id, pl = P) => Math.round(10 + dist(pl.loc, id) / 500);
const BUS_FARE = 200;
function netWorth(pl = P, pid = PID) { let w = pl.cash + pl.bank; for (const k in W.biz) if (W.biz[k].owner === pid) w += BIZ[k].price; return w; }
function ownsBiz(pid = PID) { return Object.values(W.biz).some(b => b.owner === pid); }
function rankCheck(r, pl = P, pid = PID) {
  const n = r.need, anyRep = Math.max(pl.rep.street, pl.rep.business), worth = netWorth(pl, pid);
  const parts = [];
  if (n.anyRep) parts.push({t: `Street or Business respect ${n.anyRep}+`, ok: anyRep >= n.anyRep, have: Math.floor(anyRep) + '/' + n.anyRep});
  if (n.worth) parts.push({t: `Net worth ${moneyTxt(n.worth)}+`, ok: worth >= n.worth, have: moneyTxt(worth)});
  if (n.ownsBiz) parts.push({t: 'Own a business', ok: ownsBiz(pid), have: ownsBiz(pid) ? 'yes' : 'no'});
  return {ok: parts.every(p => p.ok), parts};
}
function rankOf(pl = P, pid = PID) { let i = 0; while (i + 1 < RANKS.length && !RANKS[i + 1].stub && rankCheck(RANKS[i + 1], pl, pid).ok) i++; return i; }

// ---- time: one shared world clock; every player's needs tick with it ----
// The acting player uses `mode`; everyone else ticks as idle (or jail).
function advance(min, mode = 'idle', comfort = 0.75) {
  let left = min, ok = true;
  while (left > 0) {
    const m = Math.min(15, left), h = m / 60; left -= m;
    const before = day(); W.t += m;
    if (day() !== before) newDay(before);
    for (const pid in ST.players) {
      const pl = ST.players[pid], md = pid === PID ? mode : (pl.jail ? 'jail' : 'idle');
      if (md === 'hospital') continue;
      if (tickPlayer(pl, h, md, comfort)) { faint(pl.needs.energy <= 0 ? 'exhaustion' : 'poor health', pl, pid); if (pid === PID) ok = false; }
    }
    if (!ok) return false;
  }
  return true;
}
function tickPlayer(pl, h, mode, comfort) {
  const n = pl.needs, r = {...DECAY};
  r.energy *= (1 - 0.03 * pl.skills.endurance);
  if (n.hunger < 25) r.energy *= 1.5;
  if (mode === 'work') r.thirst += 4;
  if (mode === 'walk') r.energy += 1;
  if (mode === 'sleep') { r.hunger *= 0.5; r.thirst *= 0.4; r.hygiene *= 0.3; r.energy = -12.5 * comfort; r.mental = -1; }
  r.mental += 1.2 * ['hunger','thirst','energy','hygiene'].filter(k => n[k] < 25).length;
  for (const k in r) n[k] = clamp(n[k] - r[k] * h, 0, 100);
  if (mode === 'jail') { n.hunger = Math.max(n.hunger, 40); n.thirst = Math.max(n.thirst, 40); }
  if (n.hunger <= 0) pl.health -= 3 * h;
  if (n.thirst <= 10) pl.health -= 2 * h;
  if (n.hunger > 50 && n.thirst > 50) pl.health += (mode === 'sleep' ? 1.5 : 0.5) * h;
  pl.health = clamp(pl.health, 0, 100);
  if (!pl.jail) pl.heat = Math.max(0, pl.heat - h);
  return mode !== 'sleep' && mode !== 'jail' && (n.energy <= 0 || pl.health <= 0);
}
function faint(why, pl = P, pid = PID) {
  pl.loc = 'hospital'; pl.pending = null; pl.shift = null;
  const save = PID; PID = pid; const sp = P; P = pl;
  advance(180, 'hospital'); refillAll(pl); pl.bank -= HOSPITAL_BILL;
  popup('🏥 You fainted', `<p>You collapsed from ${why} and woke up in St. Mary's Hospital three hours later.</p><p>Grace and the team patched you up: <b>all your needs and health are full again</b>.</p><p>Hospital bill: <b>-${moneyTxt(HOSPITAL_BILL)}</b> from the bank (bank now ${moneyTxt(pl.bank)}).</p>`);
  log('🏥 Fainted, woke in hospital. All stats refilled.');
  PID = save; P = sp;
}

// ---- midnight: businesses (world) then every player's rent and bills ----
function newDay(ended) {
  for (const k in W.biz) settleBiz(k, ended);
  const save = [P, PID];
  for (const pid in ST.players) { P = ST.players[pid]; PID = pid; playerDay(ended); }
  [P, PID] = save;
}
function playerDay(ended) {
  const R = P.rent;
  if (ended >= R.due) {
    if (R.paidThrough >= R.due) {}
    else if (canPay(RENT_WEEKLY)) { pay(RENT_WEEKLY, 'bank'); R.paidThrough = R.due; log(`Rent for week ending Day ${R.due} paid automatically: -${moneyTxt(RENT_WEEKLY)}.`); }
    else { R.back += RENT_WEEKLY; R.evicted = true; addNeed('mental', -10); log(`🔒 You couldn't pay rent. The landlord changed the locks. Pay ${moneyTxt(R.back)} back rent at your door to get back in.`); }
    R.due += 7;
  }
  checkObjectives();
  const d = day(), B = P.bills;
  if (d === B.next) { B.pending = BILLS.reduce((a, b) => a + b[1], 0); B.due = d + 3; B.next += 28; log(`🧾 Monthly bills arrived: ${moneyTxt(B.pending)}, due by Day ${B.due}.`); }
  if (B.pending && d > B.due) { P.bank -= B.pending + BILL_LATE_FEE; log(`🧾 Bills overdue: ${moneyTxt(B.pending)} + ${moneyTxt(BILL_LATE_FEE)} late fee taken from the bank.`); B.pending = 0; }
  P.banned = 0;
}
// Daily P&L for a business: staff sell from stock at the set price; wages + pitch fee; profit to the owner's bank.
function settleBiz(k, ended) {
  const b = W.biz[k], D = BIZ[k]; if (!b.owner || !ST.players[b.owner]) return;
  const pl = ST.players[b.owner];
  let sold = Math.min(b.stock, b.selfSold || 0), wage = 0, note = ''; b.selfSold = 0;
  if (b.staff) {
    const s = STAFF[b.staff];
    if (rnd() < s.rel) { sold += Math.min(b.stock - sold, Math.round(D.prices[b.price] * (0.7 + 0.1 * s.skill))); wage = s.wage; }
    else note = ` ${PEOPLE.find(p => p.id === b.staff).n.split(' ')[0]} didn't turn up.`;
  }
  b.stock -= sold;
  const rev = sold * b.price, pl_ = rev - wage - D.upkeep;
  pl.bank += pl_;
  b.lastPL = {day: ended, sold, rev, wage, upkeep: D.upkeep, profit: pl_};
  if (pl_ > 0) pl.rep.business = clamp(pl.rep.business + 1, 0, 100);
  const sp = [P, PID]; P = pl; PID = b.owner;
  log(`🥙 Street Eats, Day ${ended}: sold ${sold} (${moneyTxt(rev)}), wages ${moneyTxt(wage)}, pitch ${moneyTxt(D.upkeep)} → ${pl_ >= 0 ? '+' : ''}${moneyTxt(pl_)} to the bank.${note}${b.stock < 20 ? ' Stock is low!' : ''}`);
  [P, PID] = sp;
}

// ---- objectives ----
const OBJ = [['groceries','Buy groceries at the Corner Shop'],['job','Get a job (ask Sal at the hot dog stand)'],['shift','Work your first shift'],['rent','Pay the first week\'s rent ($350) by the end of Day 7 (paying early counts)'],['friend','Make a friend (friendship 25+)']];
function checkObjectives() {
  const o = P.obj;
  if (!o.rent && P.rent.paidThrough >= 7) { o.rent = true; log('✅ Objective done: first week\'s rent paid!'); }
  if (!o.friend && PEOPLE.some(p => P.rel[p.id].f >= 25)) { o.friend = true; log('✅ Objective done: you made a friend!'); }
}
function addRel(id, v, k = 'f') { const r = P.rel[id]; r[k] = clamp(r[k] + v, 0, 100); checkObjectives(); }
const relLabel = f => f < 10 ? 'Stranger' : f < 25 ? 'Acquaintance' : f < 50 ? 'Friend' : f < 75 ? 'Good friend' : 'Best friend';
const dateChance = id => clamp(0.4 + 0.05 * P.skills.charisma + (P.rel[id].f - 40) / 100 - (P.needs.hygiene < 40 ? 0.2 : 0), 0.05, 0.95);

// ---- police, Heat (only what police or CCTV see), punishment, jail ----
function policeCheck() {
  if (P.heat < 10 || P.jail || P.pending) return;
  const p = PLACES[P.loc].police ? 1 : (['bank','realty','cafe'].includes(P.loc) ? 0.5 : 0.25);
  if (rnd() < (P.heat / 100) * p) P.pending = {kind: 'police'};
}
const runChance = (pl = P) => clamp(0.35 + 0.05 * pl.skills.speed, 0, 0.85);
function punish(mult) {
  const heat = P.heat * mult, st = Math.max(1, Math.ceil(heat / 20)), what = P.crimes.length ? [...new Set(P.crimes.map(c => c.what))].join(', ') : 'evading police';
  let msg;
  if (st <= 1) {
    if (rnd() < (P.record.length ? 0 : 0.25) + 0.06 * P.skills.charisma) msg = `👮 Verbal warning for ${what}. Being polite paid off.`;
    else { const fine = 2500 + 1000 * P.crimes.length; if (!pay(fine)) P.bank -= fine; msg = `👮 Fined ${moneyTxt(fine)} for ${what}.`; addRep('civic', -3); }
  } else if (st === 2) { const fine = 15000; if (!pay(fine)) P.bank -= fine; msg = `⚖️ Fined ${moneyTxt(fine)} for ${what}.`; addRep('civic', -5); }
  else {
    const hrs = clamp(Math.round(heat / 5), 2, 24);
    P.record.push({day: day(), what, out: `${hrs} h jail`}); P.crimes = []; P.heat = 0; addRep('civic', -10); addRep('street', 3);
    P.jail = {left: hrs, sentence: hrs, served: 0, laundry: 0, stars: st}; P.loc = 'police'; P.pending = null;
    log(`⛓️ Arrested for ${what}: ${hrs} hours in Maple City Jail.`); return;
  }
  P.record.push({day: day(), what, out: msg.replace(/^\S+ /, '')}); P.crimes = []; P.heat = 0;
  popup('Police', `<p>${msg}</p><p>Your Heat is back to zero.</p>`); log(msg);
}
const bail = (pl = P) => 12550 * Math.max(1, pl.jail.stars) + 700 * Math.ceil(pl.jail.left);
function release() {
  const J = P.jail; P.jail = null; P.loc = 'police';
  popup('🚪 Released', `<p>Out of Maple City Jail${J.bailed ? ' on bail (' + moneyTxt(J.bailed) + ')' : ''}.</p><p>Sentence: ${J.sentence} h · served ${J.served.toFixed(1)} h · ${J.laundry} laundry shift${J.laundry === 1 ? '' : 's'}.</p>`);
  log('🚪 Released from jail.');
}

// ---- Sal's shift ----
const TOP = {ketchup: '🍅 Ketchup', mustard: '🟡 Mustard', onions: '🧅 Onions', relish: '🥒 Relish'};
const canShift = () => { const h = hourF(); return P.job === 'hotdog' && P.lastShiftDay !== day() && h >= 10 && h <= 14; };
function endShift(served, failed, tips) {

  const msg = `Shift done. Served ${served}, ruined ${failed}. Wage ${moneyTxt(base)} to the bank, tips ${moneyTxt(tips)} in cash.`;

// ---- the action table ----
const ACTIONS = {
  travel({to, how}) {
    if (P.jail || to === P.loc || !PLACES[to] || PLACES[to].hidden) return;
    if (how === 'bus' && !pay(BUS_FARE)) return log('You need $2.00 for the bus.');
    const mins = how === 'bus' ? busMin(to) : walkMin(to);
    if (!advance(mins, how === 'bus' ? 'idle' : 'walk')) return;
    P.loc = to; if (how === 'walk') addSkill('speed', 0.002 * mins);
    log(`${PLACES[to].e} Arrived at ${PLACES[to].n} (${how === 'bus' ? 'bus' : 'walked'}, ${mins} min).`);
    policeCheck();
  },
  wait({h = 1}) { advance(h * 60); log(`⏳ Waited ${h} hour${h > 1 ? 's' : ''}.`); policeCheck(); },
  buy({item}) {
    const it = ITEMS[item]; if (!it || !(SHOP_STOCK[P.loc] || []).includes(item) || !isOpen(P.loc)) return;
    if (P.loc === 'shop' && P.banned) return;
    if (!pay(it.p)) return log(`Not enough money for ${it.n} (${moneyTxt(it.p)}).`);

  },
  use({item}) { if (!P.inv[item]) return; P.inv[item]--; if (!P.inv[item]) delete P.inv[item]; applyFx(ITEMS[item].fx); advance(5); log(`Used: ${ITEMS[item].n}.`); },
  home({a}) {
    const R = P.rent; if (P.loc !== 'home') return;
    if (R.evicted && a !== 'payback') return;
    if (a === 'sleep8' || a === 'nap') { const h = a === 'nap' ? 2 : 8; advance(h * 60, 'sleep', 0.75); log(`😴 Slept ${h} hours.`); }
    if (a === 'shower') { advance(15); P.needs.hygiene = 100; log('🚿 Showered: Hygiene full.'); }
    if (a === 'cook') { if (!P.fridge.meal) return log('No meals in the fridge. Buy groceries.'); P.fridge.meal--; advance(30); const g = Math.round(35 + P.skills.cooking); applyFx({hunger: g, health: 1}); addSkill('cooking', 0.05); log(`🍳 Cooked a home meal: Hunger +${g}.`); }
    if (a === 'water') { if (P.fridge.water) P.fridge.water--; advance(2); applyFx({thirst: 30}); log('💧 Drank water: Thirst +30.'); }

  },
  payRent() {
    const R = P.rent; if (P.jail) return;
    if (R.evicted) { if (!pay(R.back, 'bank')) return log(`You need ${moneyTxt(R.back)} for the back rent.`); log(`🔓 Paid ${moneyTxt(R.back)} back rent. The landlord gave you a new key.`); R.back = 0; R.evicted = false; return; }
    if (R.paidThrough >= R.due + 7) return log('Rent is already paid two weeks ahead.');
    if (!pay(RENT_WEEKLY, 'bank')) return log(`Rent is ${moneyTxt(RENT_WEEKLY)}: not enough money.`);
    R.paidThrough = R.paidThrough >= R.due ? R.due + 7 : R.due;
    log(`🏠 Rent paid early: -${moneyTxt(RENT_WEEKLY)}. Covered to the end of Day ${R.paidThrough}.`); checkObjectives();
  },
  payBills() { const B = P.bills; if (!B.pending) return; if (!pay(B.pending, 'bank')) return log('Not enough money for the bills.'); log(`🧾 Bills paid: -${moneyTxt(B.pending)}.`); B.pending = 0; },
  bank({a, amt}) {
    if (P.loc !== 'bank') return;
    if (a === 'dep') { const c = amt === 'all' ? P.cash : Math.min(P.cash, amt); if (c <= 0) return; P.cash -= c; P.bank += c; log(`🏦 Deposited ${moneyTxt(c)}.`); }
    else { const c = amt === 'all' ? Math.max(0, P.bank) : amt; if (c <= 0 || P.bank < c) return log('Not enough in the bank.'); P.bank -= c; P.cash += c; log(`🏦 Withdrew ${moneyTxt(c)}.`); }
    advance(5);
  },
  activity({kind}) {
    const at = {relax: 'park', jog: 'park', bench: 'park', gym: 'gym', gymshower: 'gym', study: 'library', chatbar: ['pub', 'anchor'], checkup: 'hospital', turnin: 'police', listings: 'realty'}[kind];
    if (!at || ![].concat(at).includes(P.loc) || !isOpen(P.loc)) return;
    const A = {
      relax: () => { advance(60); applyFx({mental: 8}); log('🌳 Relaxed in the park: Mental +8.'); },
      jog: () => { advance(30, 'work'); applyFx({energy: -8, hygiene: -10, mental: 3}); addSkill('speed', 0.08); addSkill('endurance', 0.05); log('🏃 Jogged round the pond: Speed and Endurance up.'); },
      bench: () => { advance(8 * 60, 'sleep', 0.45); applyFx({mental: -5}); log('🪑 Slept on a park bench. Not great.'); },
      gym: () => { if (!pay(500)) return log('A gym session is $5.00.'); advance(60, 'work'); applyFx({energy: -10, hygiene: -15, mental: 3}); addSkill('strength', 0.1); addSkill('endurance', 0.05); log('🏋️ Worked out: Strength +0.1.'); },

// ---- map (flat SVG from map_v2.json, pan / pinch / zoom) ----
let mview = {cx: 300, cz: -330, s: 0};
const AREA_COL = {business: '#d9dde6', shopping: '#efe0cf', poor: '#e6d9cf', medium: '#e3ecd5', rich: '#e9f0dc', farm: '#d8e8bf', port: '#d6d6d6', oldtown: '#eadfd0', lake: '#d9ecd3', southbank: '#e4e6db'};
const ROAD_W = {hi: 24, ma: 13, co: 8, st: 9, pe: 11, ra: 9, la: 6};
const mapPlaces = () => Object.keys(PLACES).filter(k => !PLACES[k].hidden);
function renderMap() {
  const list = mapPlaces().filter(k => k !== P.loc).sort((a, b) => dist(P.loc, a) - dist(P.loc, b));
  return `<div class="card" style="padding:8px"><div id="mapwrap"><svg id="msvg" xmlns="http://www.w3.org/2000/svg"></svg><div id="mks"></div><div class="zoom"><button onclick="zoomBy(1.4)">＋</button><button onclick="zoomBy(1/1.4)">－</button><button onclick="centreHere()">📍</button></div></div><p class="sub" style="margin:6px 4px 0">Maple City (map v2). Drag to move, pinch or ＋/－ to zoom, tap a place to go.</p></div>
  <div class="card"><h2>Places</h2>${list.map(k => B(`${PLACES[k].e} ${PLACES[k].n}${isOpen(k) ? '' : ' <small class="sub">(closed)</small>'}`, `openPlace('${k}')`, `${walkMin(k)} min walk`)).join('')}</div>`;
}
function initMap() {
  const w = $('#mapwrap'), svg = $('#msvg'); if (!w) return;
  if (!mview.s) mview.s = w.clientWidth / 1100;
  const pts = a => a.map(p => p.join(',')).join(' ');
  let g = MAP.areas.map(a => { const [x0, x1, z0, z1] = a[2]; return `<rect x="${x0}" y="${z0}" width="${x1 - x0}" height="${z1 - z0}" fill="${AREA_COL[a[0]] || '#e8e8e0'}"/>`; }).join('');
  g += ['sea', 'lake', 'river'].map(k => MAP.water[k].map(p => `<polygon points="${pts(p)}" fill="#9cc9e3"/>`).join('')).join('') + MAP.water.island.map(p => `<polygon points="${pts(p)}" fill="#cfe5c4"/>`).join('');
  g += MAP.blds.map(b => `<rect x="${b[0] - b[2] / 2}" y="${b[1] - b[3] / 2}" width="${b[2]}" height="${b[3]}" fill="#c4bdb0"/>`).join('');
  g += MAP.roads.map(r => `<polyline points="${pts(r[1])}" fill="none" stroke="${r[0] === 'hi' ? '#f2c14e' : '#ffffff'}" stroke-width="${ROAD_W[r[0]] || 6}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  g += MAP.areas.map(a => { const [x0, x1, z0] = a[2]; return `<text x="${(x0 + x1) / 2}" y="${z0 + 40}" text-anchor="middle" font-size="30" font-weight="700" fill="rgba(0,0,0,.35)">${a[1].split(' - ')[0].split(' (')[0]}</text>`; }).join('');
  svg.innerHTML = g; placeMap();
  let ptr = new Map(), last = null, moved = 0;
  w.onpointerdown = e => { ptr.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; last = null; };
  w.onpointermove = e => {
    if (!ptr.has(e.pointerId)) return; const prev = ptr.get(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptr.size === 1) { const dx = e.clientX - prev[0], dy = e.clientY - prev[1]; moved += Math.abs(dx) + Math.abs(dy); if (moved > 8) { if (!w.hasPointerCapture(e.pointerId)) try { w.setPointerCapture(e.pointerId); } catch (_) {} mview.cx -= dx / mview.s; mview.cz -= dy / mview.s; placeMap(); } }
    else if (ptr.size === 2) { const [a, b] = [...ptr.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (last) zoomBy(d / last); last = d; moved = 99; }
  };
  const up = e => { ptr.delete(e.pointerId); last = null; };
  w.onpointerup = up; w.onpointercancel = up;
  w.onwheel = e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15); };
  w.onclickcapture = e => { if (moved > 8) { e.stopPropagation(); e.preventDefault(); moved = 0; } };
}
function placeMap() {
  const w = $('#mapwrap'); if (!w) return; const Wd = w.clientWidth, H = w.clientHeight;
  $('#msvg').setAttribute('viewBox', `${mview.cx - Wd / 2 / mview.s} ${mview.cz - H / 2 / mview.s} ${Wd / mview.s} ${H / mview.s}`);
  view(GS, ME, () => {
    const pos = mapPlaces().map(k => ({k, x: (PLACES[k].x - mview.cx) * mview.s + Wd / 2, y: (PLACES[k].z - mview.cz) * mview.s + H / 2}));
    for (let it = 0; it < 12; it++) for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      const a = pos[i], b = pos[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
      if (d < 50) { const f = (50 - d) / 2 / d; a.x -= dx * f; a.y -= dy * f; b.x += dx * f; b.y += dy * f; } }
    $('#mks').innerHTML = pos.map(({k, x, y}) => { const Pl = PLACES[k];
      if (x < -30 || y < -30 || x > Wd + 30 || y > H + 30) return '';
      return `<button class="mk ${k === P.loc ? 'here' : ''} ${isOpen(k) ? '' : 'closed'}" style="left:${x}px;top:${y}px" onclick="openPlace('${k}')" aria-label="${Pl.n}">${Pl.e}</button>${mview.s > 0.9 ? `<div class="mklab" style="left:${x}px;top:${y + 24}px">${Pl.n}</div>` : ''}`; }).join('');
  });
}
function zoomBy(f) { const w = $('#mapwrap'); mview.s = Math.max((w ? w.clientWidth : 400) / 2600, Math.min(4, mview.s * f)); placeMap(); }
function centreHere() { const Pl = PLACES[GS.players[ME].loc]; mview.cx = Pl.x; mview.cz = Pl.z; placeMap(); }

// ---- boot ----
function boot() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => go(b.dataset.t));
  $('#modal').onclick = e => { if (e.target.id === 'modal' && modalOpen === 'ui') closeModal(); };
  const had = load(); if (!had) GS = newGame((Date.now() % 1e9) >>> 0);
  render(); if (!had) howTo();
}
window.addEventListener('DOMContentLoaded', boot);
</script></body></html>
