<style>@font-face{font-family:'Lilita';src:url('assets/lilita.woff2') format('woff2');font-display:swap}

header{background:linear-gradient(180deg,#0a0d1d,#12173a);padding:8px 12px 6px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);position:relative;z-index:15}

main{flex:1;overflow-y:auto;padding:12px 12px calc(var(--tab) + 18px);-webkit-overflow-scrolling:touch}

.row{display:flex;gap:8px}.row .btn{flex:1;justify-content:center;text-align:center}

.person{display:flex;gap:12px;align-items:flex-start}.person .info{flex:1;min-width:0}.person .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

#mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
.mk{position:absolute;transform:translate(-50%,-70%);width:58px;height:58px;border:0;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 4px 4px #000c)}

.mk.here{animation:bob 1.4s ease-in-out infinite}.mk.here::before{content:'YOU';position:absolute;top:-14px;left:50%;transform:translateX(-50%);font:800 10px system-ui;background:var(--gold);color:#2a1a00;border-radius:6px;padding:1px 5px}

// ---- deterministic RNG (mulberry32 in state; world.force = queued rolls for tests) ----
function rnd() {
  if (W.force && W.force.length) return W.force.shift();
  let t = (W.rng = (W.rng + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// ---- time: one shared world clock; every player's needs tick with it ----
function advance(min, mode = 'idle', comfort = 0.75) {

    const m = Math.min(15, left), h = m / 60; left -= m;
    const before = day(); W.t += m;
    if (day() !== before) newDay(before);
    for (const pid in ST.players) {
      const pl = ST.players[pid], md = pid === PID ? mode : (pl.jail ? 'jail' : 'idle');
      if (md === 'hospital') continue;
      if (tickPlayer(pl, h, md, comfort)) { faint(pl.needs.energy <= 0 ? 'exhaustion' : 'poor health', pl, pid); if (pid === PID) ok = false; }

}
function tickPlayer(pl, h, mode, comfort) {
  const n = pl.needs, r = {...DECAY};

  if (mode === 'walk') r.energy += 1;
  if (mode === 'sleep') { r.hunger *= 0.5; r.energy = -12.5 * comfort; r.mood = -1; }
  r.mood += 1.2 * ['hunger', 'energy'].filter(k => n[k] < 25).length;
  for (const k in r) n[k] = clamp(n[k] - r[k] * h, 0, 100);
  if (mode === 'jail') n.hunger = Math.max(n.hunger, 40);
  if (n.hunger <= 0) pl.health -= 4 * h;
  if (n.hunger > 50) pl.health += (mode === 'sleep' ? 1.5 : 0.5) * h;
  pl.health = clamp(pl.health, 0, 100);

}

  const h = hourF(); if (h < 8 || h > 21) return;
  const fi = P.follow.findIndex(f => f.day <= day());
  if (fi >= 0) { const f = P.follow.splice(fi, 1)[0]; P.eventDay = day(); P.pending = {kind: 'event', id: f.id, who: EVENTS[f.id].who, cash: f.cash || 0}; return; }
  const sid = Object.keys(EVENTS).find(k => EVENTS[k].story && EVENTS[k].fits());
  if (sid) { P.eventDay = day(); P.pending = {kind: 'event', id: sid, who: EVENTS[sid].who, cash: sid === 'vance_grand' ? grandOffer() : 0}; return; }
  if (rnd() > 0.25) return;
  const fits = Object.keys(EVENTS).filter(k => !EVENTS[k].follow && !EVENTS[k].story && EVENTS[k].fits()); if (!fits.length) return;
  const id = fits[Math.floor(rnd() * fits.length)]; P.eventDay = day();
  let who = EVENTS[id].who || null; if (id === 'friendloan') { const fr = PEOPLE.filter(p => P.rel[p.id].f >= 20 && !p.boss && !p.rival && p.id !== 'victor'); who = fr[Math.floor(rnd() * fr.length)].id; }
  const cash = id === 'wallet' ? 4000 + Math.round(rnd() * 200) * 100 : id === 'vance_offer' ? Math.round(bizValue('kiosk') * 1.5) : 0;
  P.pending = {kind: 'event', id, who, cash};
}

// next interesting moment for "Skip": a shift, Carlo, the place opening, or the morning
function nextStop() {
  const h = hourF(), base = W.t - (W.t % 1440), c = [];
  const at = hh => base + Math.round(hh * 60);
  if (h >= 21 || h < 6) { const t = h >= 21 ? base + 1440 + 7 * 60 : at(7); return {t, why: 'morning', sleep: P.loc === 'home' && !P.rent.evicted}; }
  if (P.job && P.lastShiftDay !== day() && h < 10) c.push({t: at(10), why: "Sal's shift"});
  if (P.carloDay !== day() && h < 12 && (P.metCarlo || P.path === 'street')) c.push({t: at(12), why: 'Carlo is in'});
  if (!isOpen(P.loc)) { const o = PLACES[P.loc].open[0]; if (o > h) c.push({t: at(o), why: `${PLACES[P.loc].n} opens`}); }
  if (!c.length) { if (h < 18) c.push({t: at(Math.floor(h) + 2), why: 'two hours on'}); else c.push({t: base + 1440 + 7 * 60, why: 'morning', sleep: P.loc === 'home' && !P.rent.evicted}); }
  return c.sort((a, b) => a.t - b.t)[0];
}

// ---- the Vance Tower finale and the endings ----
function grandOffer() { let v = 0; for (const k in W.biz) if (W.biz[k].owner === PID) v += bizValue(k); for (const k of myDistricts()) v += distValue(k); return Math.max(500000, v * 2); }
function finaleReq(how) {
  const P0 = [];
  const add = (t, v, max, have) => P0.push({t, ok: v >= max, v: Math.max(0, Math.min(v, max)), max, have});
  if (how === 'buy') { add(`${moneyTxt(FINALE.buyCost)} clean in the bank`, P.bank, FINALE.buyCost, moneyTxt(P.bank)); add(`Business respect ${FINALE.buyBiz}`, P.rep.business, FINALE.buyBiz, Math.floor(P.rep.business) + '/' + FINALE.buyBiz); }
  if (how === 'expose') { add(`Evidence on Vance (${FINALE.evidence})`, P.vance.evidence, FINALE.evidence, P.vance.evidence + '/' + FINALE.evidence); add(`Civic respect ${FINALE.exposeCivic}`, P.rep.civic, FINALE.exposeCivic, Math.floor(P.rep.civic) + '/' + FINALE.exposeCivic); }
  if (how === 'raid') add(`Crew of ${FINALE.raidCrew}`, crewSize(), FINALE.raidCrew, crewSize() + '/' + FINALE.raidCrew);
  if (how === 'family') { const n = ['southbank', 'port', 'poor'].filter(k => W.districts[k].control === PID).length; add('Break away from Carlo', P.story.broke ? 1 : 0, 1, P.story.broke ? 'yes' : 'not yet'); add('Take 2 of Carlo\'s districts', n, 2, n + '/2'); add('Crew of 2', crewSize(), 2, crewSize() + '/2'); }
  return {ok: P0.every(x => x.ok), parts: P0};
}
const finaleOpen = () => rankOf() >= 5 && !(P.ending && P.ending !== 'sellout') && !W.rival.beaten;
function endGame(id, cash = 0) {
  const E = ENDINGS[id];
  if (id === 'sellout') {
    earn(cash, 'Sold out to Vance', 'bank');
    for (const k in W.biz) if (W.biz[k].owner === PID) Object.assign(W.biz[k], {owner: null, tier: 0, staff: null, stock: 0, lastPL: null});
    for (const k of myDistricts()) W.districts[k].control = 'vance';
  } else {
    for (const k in W.districts) if (W.districts[k].control === 'vance' || (id === 'captain' && W.districts[k].control === 'carlo')) { W.districts[k].control = PID; W.districts[k].since = day(); }
    W.rival.beaten = PID;
  }
  P.ending = id; P.endDay = day(); P.endSeen = false;
  P.log.unshift({d: day(), c: clockTxt(), msg: `Ending: ${E.n}. ${E.how}.`, ic: 'm_crown', tone: E.tone === 'bad' ? 'bad' : 'good'});
  EV.push({pid: PID, kind: 'ending', id});
}
