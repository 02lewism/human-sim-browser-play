<style>@font-face{font-family:'Lilita';src:url('assets/lilita.woff2') format('woff2');font-display:swap}
:root{--bg:#0d1022;--bg2:#141938;--card:#1b2147;--card2:#232a57;--ink:#f1f0ff;--mut:#9aa0c8;--gold:#f5c04e;--gold2:#ffdf8a;--pink:#ff4fa3;--teal:#2ee6d6;--good:#3ddc97;--bad:#ff5d73;--warn:#ffb02e;--line:#2c3466;--tab:68px;--hf:'Lilita',system-ui,sans-serif}

header{background:linear-gradient(180deg,#0a0d1d,#12173a);padding:8px 12px 6px;padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line);position:relative;z-index:15}

main{flex:1;overflow-y:auto;padding:12px 12px calc(var(--tab) + env(safe-area-inset-bottom) + 32px);-webkit-overflow-scrolling:touch}

function rnd() {

function safePop(n) { const p = $('#sfpop'); if (!p) return; p.innerHTML = `<b>Click!</b><span>${String(n).padStart(2, '0')}</span>`; p.classList.remove('go'); void p.offsetWidth; p.classList.add('go'); const d = $('#sfdoor'); d.classList.remove('flash'); void d.offsetWidth; d.classList.add('flash'); }

// ---- v1.2 Vance raid defence: drag barricades into the three streets before his men reach your door (30 s) ----
function raidOpen(k, onResult) {
  const mus = view(GS, ME, () => hasRole('Muscle'));
  mgFrame('raid', `Hold ${DISTRICTS[k].n}`, `Vance's men are coming down three streets. Drag a barricade into a street to stop the next man in it.${mus ? ' Your Muscle slows them down.' : ''}`, 30, onResult);
  MG.d = {men: [], bars: [], tray: 3, regen: 0, next: 0.6, id: 0, stop: 0, thru: 0, sent: 0, sp: mus ? 0.85 : 1, total: 12};
  $('#mgstage').innerHTML = `<div class="rdbox"><div class="rdlanes" id="rdlanes">${[0, 1, 2].map(i => `<div class="rdlane dz" data-lane="${i}"><i class="rddoor"><img src="${A('m_flag')}" alt=""></i></div>`).join('')}</div>

let rdDrag = null;

  const x = clamp((e.clientX - r.left) / r.width * 100, 18, 88); D.tray--; D.placed = (D.placed || 0) + 1; D.bars.push({lane: +l.dataset.lane, x, id: ++D.id}); beep('tap'); buzz(20); rdDraw(); }
